<section
  id="testimonials"
  class="py-16 sm:py-20 md:py-24 border-b border-black/10 overflow-hidden"
  style="background: linear-gradient(135deg, rgb(184, 235, 20) 0%, rgb(144, 200, 0) 100%);"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 mb-10 sm:mb-12" appReveal>
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-black/15 gap-4">
      <span class="text-[0.72rem] tracking-[0.18em] uppercase font-bold text-black">// TESTIMONIALS //</span>
      <span class="text-[0.72rem] tracking-[0.18em] uppercase font-bold text-black">// SUPERCAR OWNERS //</span>
    </div>
    <h2 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-black tracking-tight">
      Words from <span class="text-refined-gradient">Clients</span>
    </h2>
  </div>

  <div class="space-y-6">
    <div class="w-full overflow-hidden">
      <div class="flex items-center gap-6 animate-marquee-right hover:[animation-play-state:paused] whitespace-normal w-max">
        @for (t of [...rowDark, ...rowDark]; track $index) {
          <article class="interactive-card w-[300px] sm:w-[360px] md:w-[400px] bg-zinc-950 text-white border border-black/20 p-6 rounded-2xl flex flex-col justify-between shadow-lg shrink-0">
            <p class="text-xs text-zinc-300 leading-relaxed mb-6 font-normal">"{{ t.quote }}"</p>
            <div class="flex items-center gap-3 pt-4 border-t border-zinc-800">
              <div class="w-8 h-8 rounded-full bg-brand-green text-black flex items-center justify-center text-[10px] font-black shrink-0">{{ t.initials }}</div>
              <div>
                <h4 class="text-xs font-bold text-white">{{ t.name }}</h4>
                <span class="text-[10px] text-zinc-400 font-medium">{{ t.role }}</span>
              </div>
            </div>
          </article>
        }
      </div>
    </div>

    <div class="w-full overflow-hidden">
      <div class="flex items-center gap-6 animate-marquee hover:[animation-play-state:paused] whitespace-normal w-max">
        @for (t of [...rowLight, ...rowLight]; track $index) {
          <article class="interactive-card w-[300px] sm:w-[360px] md:w-[400px] bg-white text-zinc-950 border border-black/15 p-6 rounded-2xl flex flex-col justify-between shadow-lg shrink-0">
            <p class="text-xs text-zinc-600 leading-relaxed mb-6 font-normal">"{{ t.quote }}"</p>
            <div class="flex items-center gap-3 pt-4 border-t border-zinc-100">
              <div class="w-8 h-8 rounded-full bg-black text-brand-green flex items-center justify-center text-[10px] font-black shrink-0">{{ t.initials }}</div>
              <div>
                <h4 class="text-xs font-bold text-zinc-950">{{ t.name }}</h4>
                <span class="text-[10px] text-zinc-500 font-medium">{{ t.role }}</span>
              </div>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
