<section class="section-screen py-16 sm:py-20 md:py-24 bg-white border-b border-zinc-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-zinc-200 gap-4">
      <span class="section-tag">// OUR LEADERSHIP //</span>
      <span class="section-tag">// THE CREATIVE FORCE //</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-10 items-center">
      <div class="md:col-span-4" appReveal>
        <h2 appScrollTextReveal class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-zinc-950 tracking-tight mb-6">
          People Behind<br><span class="text-refined-gradient">The Craft</span>
        </h2>
        <p class="text-xs text-zinc-500 leading-relaxed mb-6 font-medium">
          Master installers and materials engineers pioneering elite paint protection across India.
        </p>
        <a href="#about" class="btn-gradient-stroke inline-flex items-center justify-center px-6 py-2.5 rounded-full border border-zinc-300 text-xs font-bold text-zinc-900 shadow-sm">
          <span>Know about us</span>
        </a>
      </div>

      <div class="md:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-6" appReveal>
        @for (founder of founders; track founder.name) {
          <div class="interactive-card group relative rounded-2xl overflow-hidden border border-zinc-200 bg-zinc-100 aspect-[4/5]">
            <img
              [src]="founder.image"
              [alt]="'Portrait of ' + founder.name"
              loading="lazy"
              class="w-full h-full object-cover object-[center_20%] grayscale group-hover:grayscale-0 transition duration-700 group-hover:scale-105"
            >
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex items-end p-6 z-[1]">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <h3 class="text-base font-bold text-white">{{ founder.name }}</h3>
                  <span class="w-2 h-2 rounded-full bg-brand-green"></span>
                </div>
                <span class="text-xs text-zinc-300 font-medium">{{ founder.role }}</span>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
