<section
  id="services"
  class="section-screen py-16 sm:py-20 md:py-24 relative border-b border-black/10"
  style="background: linear-gradient(135deg, rgb(184, 235, 20) 0%, rgb(144, 200, 0) 100%);"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 sm:mb-16 gap-4" appReveal>
      <h2 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-black mb-1">
        Our <span class="text-black">PPF Lineup</span>
      </h2>
      <p class="text-sm sm:text-base text-black/80 max-w-sm font-medium leading-snug">
        Engineered with advanced thermoplastic polyurethane to protect and amplify exotic vehicle bodywork.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
      @for (card of cards; track card.title) {
        <article class="interactive-card bg-white rounded-3xl p-3 sm:p-4 flex flex-col justify-between shadow-lg group" appReveal>
          <div class="p-5 pb-6">
            <h3 class="text-2xl sm:text-3xl font-extrabold text-black tracking-tight mb-3">{{ card.title }}</h3>
            <p class="text-sm text-zinc-600 leading-relaxed font-normal">{{ card.description }}</p>
          </div>
          <div class="relative rounded-2xl overflow-hidden aspect-[4/3] bg-zinc-900">
            <img [src]="card.image" [alt]="card.title" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
            <div class="absolute bottom-4 left-4 z-10">
              <a href="#contact" class="btn-gradient-stroke inline-flex items-center gap-2 px-5 py-2 rounded-full text-xs font-bold tracking-tight shadow-md">
                <span>{{ card.cta }}</span>
                <span>→</span>
              </a>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
